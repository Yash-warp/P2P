<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lendit-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30105E" />
      <stop offset="50%" stop-color="#230B48" />
      <stop offset="100%" stop-color="#14042E" />
    </linearGradient>

    <!-- Gradient for Primary L Curve -->
    <linearGradient id="lendit-grad-primary" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Gradient for Dynamic Interlocking Loop -->
    <linearGradient id="lendit-grad-accent" x1="100" y1="20" x2="20" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Drop Shadow Filter for depth -->
    <filter id="lendit-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Pill Container -->
  <rect x="4" y="4" width="112" height="112" rx="32" fill="url(#lendit-bg)" stroke="#E9D5FF" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Outer subtle glowing inner ring -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="none" stroke="url(#lendit-grad-primary)" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Logo Graphics: Modern Interlocking "L" & Orbit Sharing Loop -->
  <g filter="url(#lendit-shadow)">
    <!-- Right Sharing Loop (Cyan to Violet) -->
    <path
      d="M58 42 C66 32 84 32 90 42 C97 53 97 67 88 76 C80 84 66 82 56 70 L42 54"
      stroke="url(#lendit-grad-accent)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Left "L" Shape (Lavender to Deep Purple-Violet) -->
    <path
      d="M36 28 L36 72 C36 82 46 88 56 88 C68 88 80 82 86 74"
      stroke="url(#lendit-grad-primary)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Overlapping Connector Knot / Focus Jewel -->
    <circle cx="56" cy="70" r="5" fill="#FAF8FF" />
    <circle cx="36" cy="28" r="4.5" fill="#C4B5FD" />
    <circle cx="86" cy="74" r="4.5" fill="#10B981" />
  </g>
</svg>

